name: Check and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test
        run: npm run check
      - name: Check committed bundle
        run: git diff --exit-code -- ha-feiertage-serbien.js
      - name: Publish stable version when not yet released
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Bump package.json for a new release."
          else
            gh release create "$tag" ha-feiertage-serbien.js --target "$GITHUB_SHA" --title "$tag – Feiertage & Traditionen Serbien" --notes-file RELEASE_NOTES.md --latest
          fi
